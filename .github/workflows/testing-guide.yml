# Follows Docs/testing-your-app.md on clean Linux and Windows runners: install gnustep-cli,
# install tools-xctest with `gnustep install`, then run
# Examples/FirstTest's tests, and check that a failing test fails `make check`.
name: Testing guide

on:
  workflow_dispatch:
  pull_request:
    paths:
      - Docs/testing-your-app.md
      - Examples/FirstTest/**
      - .github/workflows/testing-guide.yml
  push:
    branches: [master]
    paths:
      - Docs/testing-your-app.md
      - Examples/FirstTest/**
      - .github/workflows/testing-guide.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      GNUSTEP_CLI_VERSION: 0.1.9
      GNUSTEP_CLI_BOOTSTRAP_SHA256: 3fca82d1b20f58af3bd97ef84c7991e8d0061be80eddc613d3b3b47c6e6a6895
    steps:
      - uses: actions/checkout@v4

      - name: Install gnustep-cli (guide step 1)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/danjboyd/gnustep-cli-new/releases/download/v$GNUSTEP_CLI_VERSION/gnustep-bootstrap.sh"
          echo "$GNUSTEP_CLI_BOOTSTRAP_SHA256  gnustep-bootstrap.sh" | sha256sum -c -
          sh gnustep-bootstrap.sh setup --user --yes
          root="$HOME/.local/share/gnustep-cli"
          echo "$root/bin" >> "$GITHUB_PATH"
          echo "$root/Tools" >> "$GITHUB_PATH"
          echo "$root/System/Tools" >> "$GITHUB_PATH"

      - name: Install tools-xctest (guide step 2)
        run: |
          . "$HOME/.local/share/gnustep-cli/System/Library/Makefiles/GNUstep.sh"
          gnustep install tools-xctest
          command -v xctest
          ls "$GNUSTEP_MAKEFILES/Auxiliary/xctest.make"

      - name: Run the example's tests (guide steps 3 and 4)
        run: |
          . "$HOME/.local/share/gnustep-cli/System/Library/Makefiles/GNUstep.sh"
          make -C Examples/FirstTest/Tests check XCTEST_FLAGS="-junit-report $RUNNER_TEMP/CounterTests.xml"
          grep -q 'tests="3"' "$RUNNER_TEMP/CounterTests.xml"
          grep -q 'failures="0"' "$RUNNER_TEMP/CounterTests.xml"

      - name: A failing test fails make check
        run: |
          . "$HOME/.local/share/gnustep-cli/System/Library/Makefiles/GNUstep.sh"
          sed -i 's/XCTAssertEqual(\[counter value\], 2);/XCTAssertEqual([counter value], 3);/' Examples/FirstTest/Tests/CounterTests.m
          grep -q 'XCTAssertEqual(\[counter value\], 3);' Examples/FirstTest/Tests/CounterTests.m
          if make -C Examples/FirstTest/Tests check; then
            echo "make check passed with a failing test" >&2
            exit 1
          fi
          echo "make check failed, as it should."

  # The same steps on Windows, with gnustep-cli's PowerShell bootstrap and
  # its managed MSYS2 clang64 toolchain (bash and make come with it).
  windows:
    runs-on: windows-2022
    env:
      GNUSTEP_CLI_VERSION: 0.1.9
      GNUSTEP_CLI_BOOTSTRAP_PS1_SHA256: 4d39c0e45c618dd38dad533bdc6decd9a4b4cbd92b913084b1d75043298e7bf7
    defaults:
      run:
        # The managed toolchain's own bash (setup installs it under
        # %LOCALAPPDATA%\gnustep-cli; the first step checks that's here).
        shell: C:\Users\runneradmin\AppData\Local\gnustep-cli\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install gnustep-cli (guide step 1)
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          Invoke-WebRequest -Uri "https://github.com/danjboyd/gnustep-cli-new/releases/download/v$env:GNUSTEP_CLI_VERSION/gnustep-bootstrap.ps1" -OutFile gnustep-bootstrap.ps1
          $hash = (Get-FileHash -Algorithm SHA256 gnustep-bootstrap.ps1).Hash.ToLower()
          if ($hash -ne $env:GNUSTEP_CLI_BOOTSTRAP_PS1_SHA256) { throw "gnustep-bootstrap.ps1 digest $hash" }
          ./gnustep-bootstrap.ps1 setup --user --yes
          $root = Join-Path $env:LOCALAPPDATA "gnustep-cli"
          if ($root -ne "C:\Users\runneradmin\AppData\Local\gnustep-cli") { throw "unexpected install root $root" }
          Get-ChildItem $root
          & "$root\bin\gnustep.exe" --version

      - name: Install tools-xctest (guide step 2)
        run: |
          export MSYSTEM=CLANG64 PATH="/clang64/bin:/usr/bin:$PATH"
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          root="$(cygpath -u "$LOCALAPPDATA")/gnustep-cli"
          "$root/bin/gnustep.exe" install tools-xctest
          # On Windows the runner on PATH is a .cmd launcher, for PowerShell
          # and cmd; make check runs the package's xctest.exe directly.
          ls "$root/bin/xctest.cmd"
          ls "$GNUSTEP_MAKEFILES/Auxiliary/xctest.make"

      - name: Run the example's tests (guide steps 3 and 4)
        run: |
          export MSYSTEM=CLANG64 PATH="/clang64/bin:/usr/bin:$PATH"
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          report="$(cygpath -m "$RUNNER_TEMP")/CounterTests.xml"
          make -C Examples/FirstTest/Tests check XCTEST_FLAGS="-junit-report $report"
          grep -q 'tests="3"' "$report"
          grep -q 'failures="0"' "$report"

      - name: A failing test fails make check
        run: |
          export MSYSTEM=CLANG64 PATH="/clang64/bin:/usr/bin:$PATH"
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          sed -i 's/XCTAssertEqual(\[counter value\], 2);/XCTAssertEqual([counter value], 3);/' Examples/FirstTest/Tests/CounterTests.m
          grep -q 'XCTAssertEqual(\[counter value\], 3);' Examples/FirstTest/Tests/CounterTests.m
          if make -C Examples/FirstTest/Tests check; then
            echo "make check passed with a failing test" >&2
            exit 1
          fi
          echo "make check failed, as it should."
