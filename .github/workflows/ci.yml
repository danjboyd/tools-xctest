name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (clang, libobjc2)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PREFIX: ${{ github.workspace }}/../gnustep
    steps:
      - uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get -q update
          sudo apt-get -q -y install clang lld cmake ninja-build meson pkg-config xvfb \
            libffi-dev libgnutls28-dev libxml2-dev libxslt1-dev libicu-dev zlib1g-dev \
            libcurl4-gnutls-dev libjpeg-dev libtiff-dev libpng-dev \
            libcairo2-dev libfreetype-dev libfontconfig-dev \
            libx11-dev libxext-dev libxft-dev libxrender-dev libxt-dev libxmu-dev

      - name: Cache GNUstep
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-ubuntu-24.04-${{ hashFiles('.github/scripts/install-gnustep.sh') }}

      - name: Build GNUstep
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/scripts/install-gnustep.sh

      # Serial, as the package builds it: libXCTestHost links against
      # libXCTest from the same directory.
      - name: Build
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          make

      # gnustep-swift's tools-make (makefiles only, into a scratch prefix),
      # for run-make-swift-tests.sh: Swift test bundles through xctest.make,
      # built with a stand-in Swift toolchain.
      - name: Install gnustep-swift's tools-make
        run: |
          git clone -q https://github.com/danjboyd/tools-make.git "$RUNNER_TEMP/tools-make-swift-src"
          cd "$RUNNER_TEMP/tools-make-swift-src"
          git checkout -q 3dbfc7d3177e6b08a04102394296b3db0cc96fb5
          # Its configure looks for libobjc2's blocks runtime, as install-gnustep.sh's does.
          export CC=clang CPPFLAGS="-I$PREFIX/include" LDFLAGS="-L$PREFIX/System/Library/Libraries -fuse-ld=lld"
          export LD_LIBRARY_PATH="$PREFIX/System/Library/Libraries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./configure --prefix="$RUNNER_TEMP/tools-make-swift" --with-layout=gnustep \
            --with-library-combo=ng-gnu-gnu --with-runtime-abi=gnustep-2.2 > /dev/null
          make install > /dev/null
          echo "XCTEST_SWIFT_MAKEFILES=$RUNNER_TEMP/tools-make-swift/System/Library/Makefiles" >> "$GITHUB_ENV"

      - name: make check
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          xvfb-run -a make check

      - name: meson test
        run: |
          . "$PREFIX/System/Library/Makefiles/GNUstep.sh"
          OBJC=clang CC=clang meson setup build-meson
          meson compile -C build-meson
          xvfb-run -a meson test -C build-meson --print-errorlogs

  windows:
    name: Windows (MSYS2 clang64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libobjc2
            mingw-w64-clang-x86_64-libdispatch
            mingw-w64-clang-x86_64-gnustep-make
            mingw-w64-clang-x86_64-gnustep-base

      # MSYS2's gnustep-base 1.31.1-10 puts __block on an instance variable,
      # which clang 23 rejects; apply libs-base's fix (gnustep/libs-base#809).
      - name: Patch gnustep-base header
        run: |
          sed -i 's/BLOCK_SCOPE GSScheduledBlock _block;/GSScheduledBlock _block;/' \
            /clang64/include/Foundation/NSBackgroundActivityScheduler.h

      # MSYS2's libdispatch headers (included by Foundation) typedef
      # mode_t again unless HAVE_MODE_T is defined.
      - name: Build
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export ADDITIONAL_CPPFLAGS=-DHAVE_MODE_T
          make

      # The hosted-test script is left out on Windows (no -host there).
      - name: make check
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export ADDITIONAL_CPPFLAGS=-DHAVE_MODE_T
          make check
