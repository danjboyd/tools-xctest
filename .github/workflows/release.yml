name: Release

# Pushing a vX.Y.Z tag builds and tests the release, then creates a GitHub
# release with the CHANGELOG section, a source archive and a Windows build.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.5.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows build (MSYS2 clang64)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            zip
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libobjc2
            mingw-w64-clang-x86_64-libdispatch
            mingw-w64-clang-x86_64-gnustep-make
            mingw-w64-clang-x86_64-gnustep-base

      # MSYS2's gnustep-base 1.31.1-10 puts __block on an instance variable,
      # which clang 23 rejects; apply libs-base's fix (gnustep/libs-base#809).
      - name: Patch gnustep-base header
        run: |
          sed -i 's/BLOCK_SCOPE GSScheduledBlock _block;/GSScheduledBlock _block;/' \
            /clang64/include/Foundation/NSBackgroundActivityScheduler.h

      # As in ci.yml: MSYS2's libdispatch headers need HAVE_MODE_T.
      - name: Build, test and stage
        run: |
          . /clang64/share/GNUstep/Makefiles/GNUstep.sh
          export ADDITIONAL_CPPFLAGS=-DHAVE_MODE_T
          make
          make check
          make install DESTDIR="$PWD/stage"
          cp README.md CHANGELOG.md COPYING.LIB stage/
          (cd stage && zip -qr "../tools-xctest-${TAG#v}-msys2-clang64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: tools-xctest-*-msys2-clang64.zip

  release:
    name: GitHub release
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: windows

      - name: Source archive and release notes
        run: |
          version="${TAG#v}"
          git archive --format=tar.gz --prefix="tools-xctest-$version/" \
            -o "tools-xctest-$version.tar.gz" "$TAG"
          # The CHANGELOG section for this version.
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --title "tools-xctest ${TAG#v}" \
            --notes-file notes.md \
            tools-xctest-*.tar.gz tools-xctest-*-msys2-clang64.zip
